# Runs searchd's tests on every push and pull request. The tests never touch the network
# (see tests/helpers/no-network.cjs) and there's nothing to install: zero npm dependencies.
# "18" is the newest Node 18 (18.20.x): the oldest version searchd supports. (The scripts only
# need 18.3 for util.parseArgs, but the tests use node:test's beforeEach, which needs 18.8, so
# the version we promise is the one CI can actually check.)
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18", "20", "22", "24"]
        # One macOS job is enough (what differs there is the OS, not Node), and GitHub's macOS
        # runners are often short: four of them used to sit in the queue until cancelled.
        include:
          - os: macos-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
