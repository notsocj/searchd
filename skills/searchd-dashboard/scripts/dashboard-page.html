<!doctype html>
<!--
  dashboard-page.html — the searchd dashboard template.

  dashboard.js copies this file into .searchd/dashboard.html and fills in three placeholders:
  the two fonts (base64) and the data (JSON). Everything else is right here: CSS at the top,
  JavaScript at the bottom, no libraries, nothing loaded from the internet except app icons
  from Apple's servers.

  Safety: app names come from the App Store, so they're untrusted text. They're only ever
  inserted with textContent (never innerHTML), and the Content-Security-Policy below blocks
  every script except the inline ones in this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:">
<title>searchd</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512' role='img' aria-label='searchd'%3E%3Crect width='512' height='512' rx='116' fill='%231fc27d'/%3E%3Cg fill='none' stroke='%2304140c' stroke-width='40' stroke-linecap='round'%3E%3Ccircle cx='222' cy='222' r='116'/%3E%3Cpath d='M312 312L402 402'/%3E%3C/g%3E%3Cg fill='%2304140c'%3E%3Crect x='166' y='228' width='30' height='52' rx='9'/%3E%3Crect x='207' y='196' width='30' height='84' rx='9'/%3E%3C/g%3E%3Crect x='248' y='156' width='30' height='124' rx='9' fill='%23fff'/%3E%3C/svg%3E">
<style>
  @font-face { font-family: "Poppins"; font-weight: 400; font-display: swap; src: url("data:font/woff2;base64,/*FONT_400*/") format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 600; font-display: swap; src: url("data:font/woff2;base64,/*FONT_600*/") format("woff2"); }

  /* Colors are tokens, so dark and light mode only swap values. Dark is the default. */
  :root {
    --bg: #0b0c0f; --panel: #13151a; --panel-2: #1a1d24; --hover: #1e222a;
    --side: #0e1014; --line: #23272f; --line-2: #2f343e; --text: #eceef2; --muted: #9ba1ae; --faint: #6b717e;
    --accent: #1fc27d; --accent-soft: rgba(31, 194, 125, 0.14); --accent-ink: #04140c;
    --gold: #f5c542; --gold-soft: rgba(245, 197, 66, 0.15);
    --good: #1fc27d; --good-soft: rgba(31, 194, 125, 0.13);
    --mid: #6ea8ff; --mid-soft: rgba(110, 168, 255, 0.12);
    --low: #9ba1ae; --low-soft: rgba(155, 161, 174, 0.10);
    --hard: #ff8a4c; --up: #1fc27d; --down: #ff6b6b;
    --radius: 12px; --radius-sm: 8px;
    color-scheme: dark;
  }
  /* Light: when the system is light (unless the user picked dark), or when the user picked light. */
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8; --side: #ffffff; --panel: #ffffff; --panel-2: #f1f3f6; --hover: #eceff3;
      --line: #e3e6eb; --line-2: #d5d9e0; --text: #14171d; --muted: #5d6370; --faint: #8b909b;
      --accent: #0e9a5f; --accent-soft: rgba(14, 154, 95, 0.10); --accent-ink: #ffffff;
      --gold: #b9850a; --gold-soft: rgba(214, 160, 20, 0.14);
      --good: #0e9a5f; --good-soft: rgba(14, 154, 95, 0.10);
      --mid: #2f6fe0; --mid-soft: rgba(47, 111, 224, 0.09);
      --low: #6b7180; --low-soft: rgba(107, 113, 128, 0.09);
      --hard: #d9622b; --up: #0e9a5f; --down: #d64545;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8; --side: #ffffff; --panel: #ffffff; --panel-2: #f1f3f6; --hover: #eceff3;
    --line: #e3e6eb; --line-2: #d5d9e0; --text: #14171d; --muted: #5d6370; --faint: #8b909b;
    --accent: #0e9a5f; --accent-soft: rgba(14, 154, 95, 0.10); --accent-ink: #ffffff;
    --gold: #b9850a; --gold-soft: rgba(214, 160, 20, 0.14);
    --good: #0e9a5f; --good-soft: rgba(14, 154, 95, 0.10);
    --mid: #2f6fe0; --mid-soft: rgba(47, 111, 224, 0.09);
    --low: #6b7180; --low-soft: rgba(107, 113, 128, 0.09);
    --hard: #d9622b; --up: #0e9a5f; --down: #d64545;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 14px/1.5 "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .ic { width: 18px; height: 18px; flex: none; display: block; }
  /* Strong ease-out: starts fast so a press feels heard. Used for every transition below. */
  /* --ease-in-out is for things that move across the screen (the theme thumb). */
  :root { --ease: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); --side-w: 248px; }
  button { transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease); }
  button:active { transform: scale(0.97); }

  /* App frame: fixed sidebar | scrolling content */
  .app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
  .wrap { max-width: 1180px; width: 100%; margin: 0 auto; padding: 32px 32px 64px; }

  /* Sidebar */
  .side { position: sticky; top: 0; height: 100vh; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; padding: 18px 14px 14px; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: -0.02em; color: var(--text); padding: 2px 8px 14px; }
  .mark { width: 30px; height: 30px; flex: none; }
  .brand b { color: var(--accent); font-weight: 600; }
  .app-card { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; min-width: 0; }
  .app-icon { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); flex: none; }
  .app-card .meta { min-width: 0; }
  .app-name { font-weight: 600; font-size: 13px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .app-sub { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .nav-label { font-size: 12px; font-weight: 600; color: var(--faint); padding: 8px 10px 4px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-btn { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: transparent; color: var(--muted); padding: 9px 10px; border-radius: 9px; font-weight: 500; text-align: left; cursor: pointer; }
  .nav-btn .lbl { flex: 1; }
  .nav-btn.is-active { background: var(--accent-soft); color: var(--text); }
  .nav-btn.is-active .ic { color: var(--accent); }
  .count { font-size: 11px; font-weight: 600; min-width: 22px; text-align: center; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); color: var(--muted); font-variant-numeric: tabular-nums; transition: background-color 150ms var(--ease), color 150ms var(--ease); }
  .nav-btn .ic { transition: color 150ms var(--ease); }
  .nav-btn.is-active .count { background: var(--accent); color: var(--accent-ink); }
  .side-spacer { flex: 1; min-height: 12px; }
  .run-card { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 12px; display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  .run-card b { color: var(--text); font-weight: 600; }
  .flags { font-size: 15px; letter-spacing: 2px; line-height: 1.5; }
  .side-foot { padding: 8px 0 0; }

  /* Theme switch: a two-segment control with a thumb that slides to the picked side.
     The thumb is as wide as one button (50% minus the 3px inset), so translateX(100%) lands it
     exactly on the second one. JS sets data-on, and adds .ready after the first frame so the
     thumb doesn't slide on page load. */
  .theme-switch { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; }
  .theme-switch .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 7px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0, 0, 0, 0.18); }
  .theme-switch[data-on="dark"] .thumb { transform: translateX(100%); }
  .ready .theme-switch .thumb { transition: transform 240ms var(--ease-in-out); }
  .theme-switch button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; background: transparent; color: var(--faint); padding: 6px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; }
  .theme-switch button:focus-visible { outline-offset: 0; }
  .theme-switch button[aria-pressed="true"] { color: var(--text); }
  .theme-switch button[aria-pressed="true"] .ic { color: var(--accent); }
  /* The picked icon turns a little as the thumb arrives: the sun a quarter turn (it looks the same, so only the motion reads), the moon a tilt */
  .theme-switch .ic { width: 16px; height: 16px; transition: transform 320ms var(--ease); }
  .theme-switch [data-set="light"][aria-pressed="true"] .ic { transform: rotate(90deg); }
  .theme-switch [data-set="dark"][aria-pressed="true"] .ic { transform: rotate(-15deg); }

  /* Hover only where hover exists, so taps on a phone don't leave things stuck highlighted */
  @media (hover: hover) and (pointer: fine) {
    .nav-btn:hover { background: var(--hover); color: var(--text); }
    .theme-switch button:hover { color: var(--text); }
  }

  /* Page head: what you're looking at, in plain words */
  .page-head { margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; line-height: 1.25; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .page-head .sub { margin-top: 2px; max-width: 70ch; }
  .topbar { display: none; }

  /* Toolbar: country chips + filters */
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
  .chip {
    border: 1px solid var(--line-2); background: var(--panel); color: var(--muted);
    border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .chip { transition: background-color 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease); }
  @media (hover: hover) and (pointer: fine) { .chip:hover { color: var(--text); border-color: var(--accent); } }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .toolbar .sep { width: 1px; height: 20px; background: var(--line-2); margin: 0 4px; }
  .hint { color: var(--faint); font-size: 12px; }

  /* Panels and tables */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--faint); font-weight: 400; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
  @media (hover: hover) and (pointer: fine) { tbody tr:hover td { background: var(--hover); } }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.center, th.center { text-align: center; }
  .kw { font-weight: 600; }
  .orig { color: var(--faint); font-size: 12px; }
  .status { font-size: 11px; color: var(--faint); border: 1px solid var(--line-2); border-radius: 999px; padding: 0 7px; margin-left: 6px; white-space: nowrap; }
  /* The first column stays visible while the board scrolls sideways */
  .board td:first-child, .board th:first-child { position: sticky; left: 0; background: var(--panel); z-index: 1; min-width: 150px; }
  @media (hover: hover) and (pointer: fine) { .board tbody tr:hover td:first-child { background: var(--hover); } }

  /* Rank pills, colored by band */
  .rank { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .medal { background: var(--gold-soft); font-size: 16px; line-height: 1.3; padding: 1px 8px; }
  .r-10 { background: var(--good-soft); color: var(--good); }
  .r-50 { background: var(--mid-soft); color: var(--mid); }
  .r-200 { background: var(--low-soft); color: var(--low); }
  .r-none { color: var(--faint); font-weight: 400; }
  .delta { font-size: 11px; margin-left: 4px; font-weight: 600; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }

  /* Score bars */
  .score { display: flex; align-items: center; gap: 8px; min-width: 110px; }
  .score .n { width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 6px; border-radius: 999px; background: var(--panel-2); overflow: hidden; min-width: 50px; }
  .bar span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
  .bar.hard span { background: var(--hard); }
  tr.sweet td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
  .star { color: var(--gold); margin-left: 4px; }

  /* App icons in the "top 5" column */
  .icons { display: flex; gap: 4px; }
  .icons img { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); }
  .icons img.me { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Competitors */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: grid; grid-template-columns: 28px 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list .pos { color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
  .list img { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); }
  .list .name { font-weight: 600; overflow-wrap: anywhere; }
  .list .beats { text-align: right; white-space: nowrap; }
  .list .beats b { font-size: 18px; }
  .tag { font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; margin-left: 6px; font-weight: 600; white-space: nowrap; }
  h2 { font-size: 15px; font-weight: 600; margin: 28px 0 10px; }
  h2:first-child { margin-top: 0; }

  /* History: summary strip, then one small rank-over-time chart per keyword */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat { padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .chart { padding: 14px 14px 12px; }
  .chart .title { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .chart .title .kw { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart svg { display: block; width: 100%; height: auto; margin-top: 8px; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
  .chart .axis { fill: var(--faint); font-size: 10px; font-family: inherit; }
  .chart .area { fill: var(--accent-soft); stroke: none; }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5; }
  .chart .halo { fill: var(--accent); opacity: 0.18; }
  .chart .gap { fill: var(--faint); }
  .chart .foot { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .chart .foot b { color: var(--text); font-weight: 600; }
  /* Release markers on the charts, and the release list above them */
  .chart .rel line { stroke: var(--gold); stroke-width: 1; stroke-dasharray: 2 3; }
  .chart .rel text { fill: var(--gold); font-size: 9px; font-weight: 600; font-family: inherit; }
  .list.releases li { grid-template-columns: auto minmax(0, 1fr) auto; }
  .releases .ver { font-weight: 600; font-variant-numeric: tabular-nums; background: var(--gold-soft); color: var(--gold); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
  .releases .notes { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .releases .when { display: flex; flex-wrap: wrap; align-items: center; row-gap: 4px; }
  .releases .beats .delta { font-size: 15px; margin: 0 0 0 8px; }

  .empty { color: var(--muted); padding: 40px 16px; text-align: center; }
  .empty code { background: var(--panel-2); padding: 2px 6px; border-radius: 6px; }
  footer { color: var(--faint); font-size: 12px; margin-top: 28px; max-width: 70ch; }

  /* Motion: every view builds itself up. The view is rebuilt on each tab, country or filter
     change; its frame fades in, then the rows (table rows, competitors, stat cards, charts) rise
     in one after another. JS gives each row its place in line as --d (see stagger()), and the
     row's bars fill and its chart draws just after the row lands, so the table fills top to
     bottom. Nothing waits on this: the content is clickable the whole time. */
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fill { from { clip-path: inset(0 100% 0 0); } }
  @keyframes draw { from { stroke-dashoffset: 1; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  #view > * { animation: fade 160ms var(--ease) both; }
  .rise { animation: rise 280ms var(--d, 0ms) var(--ease) both; }
  .bar span { animation: fill 420ms calc(var(--d, 0ms) + 120ms) var(--ease) both; }
  /* pathLength="1" on the line makes one dash exactly the line's length, whatever its shape */
  .chart .line { stroke-dasharray: 1; animation: draw 600ms calc(var(--d, 0ms) + 160ms) var(--ease) both; }
  .chart .area { animation: fade 400ms calc(var(--d, 0ms) + 300ms) var(--ease) both; }
  .chart :is(.dot, .gap) { animation: fade 200ms calc(var(--d, 0ms) + 460ms) var(--ease) both; }
  .chart .halo { transform-box: fill-box; transform-origin: center; animation: pop 360ms calc(var(--d, 0ms) + 600ms) var(--ease) both; }
  .chart .rel { animation: fade 300ms calc(var(--d, 0ms) + 300ms) var(--ease) both; }
  td { transition: background-color 120ms ease; }

  /* Reduced motion: keep the fades (they help you see what changed), drop everything that moves */
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; } button:active { transform: none; }
    .rise { animation-name: fade; }
    .bar span, .chart .line, .chart .halo { animation: none; }
    .ready .theme-switch .thumb, .theme-switch .ic { transition: none; }
  }
  /* The theme crossfade (JS, View Transitions): the switches skip it so their thumb slides live,
     without a ghost of the old one fading out underneath. */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 220ms; animation-timing-function: var(--ease); }
  .side .theme-switch { view-transition-name: theme-side; }
  .topbar .theme-switch { view-transition-name: theme-top; }
  ::view-transition-old(theme-side), ::view-transition-old(theme-top) { display: none; }
  ::view-transition-new(theme-side), ::view-transition-new(theme-top) { animation: none; }

  /* Tablet: the sidebar shrinks to an icon rail */
  @media (max-width: 1000px) {
    :root { --side-w: 68px; }
    .side { padding: 14px 10px; align-items: center; }
    .brand { padding: 4px 0 12px; }
    .brand .word, .app-card .meta, .nav-label, .nav-btn .lbl, .run-card, .theme-switch .lbl { display: none; }
    .app-card { padding: 4px; border-radius: 12px; }
    .nav-btn { justify-content: center; padding: 10px; position: relative; width: auto; }
    .nav-btn .count { position: absolute; top: 1px; right: -3px; min-width: 18px; padding: 0 5px; font-size: 10px; }
    /* The rail is too narrow for side by side: stack the switch, and slide the thumb down instead */
    .side .theme-switch { grid-auto-flow: row; }
    .side .theme-switch .thumb { right: 3px; bottom: auto; width: auto; height: calc(50% - 3px); }
    .side .theme-switch[data-on="dark"] .thumb { transform: translateY(100%); }
    .wrap { padding: 28px 24px 56px; }
  }

  /* Phone: slim top bar + bottom tab bar (thumb reach), no sidebar */
  @media (max-width: 640px) {
    .app { display: block; }
    .side { position: static; height: auto; display: contents; }
    .side .brand, .side .app-card, .side .nav-label, .side .run-card, .side .side-spacer, .side .side-foot { display: none; }
    .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; position: sticky; top: 0; z-index: 5; background: var(--side); border-bottom: 1px solid var(--line); }
    .topbar .app-icon { width: 30px; height: 30px; border-radius: 8px; }
    .topbar .app-name { flex: 1; min-width: 0; -webkit-line-clamp: 1; }
    .topbar .theme-switch button { padding: 5px 8px; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; flex-direction: row; justify-content: space-around; gap: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--side); border-top: 1px solid var(--line); }
    .nav-btn { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 2px; flex: 1; min-width: 0; justify-content: center; align-items: center; }
    .nav-btn .lbl { display: block; flex: none; }
    .nav-btn .count { display: none; }
    .nav-btn.is-active { background: transparent; color: var(--accent); }
    .wrap { padding: 18px 16px calc(84px + env(safe-area-inset-bottom)); }
    h1 { font-size: 19px; }
    th, td { padding: 8px 9px; }
    .list li { grid-template-columns: 36px 1fr auto; }
    .list .pos { display: none; }
    /* Releases: the up/down counts get their own line under the version and date */
    .list.releases li { grid-template-columns: auto minmax(0, 1fr); row-gap: 6px; }
    .releases .beats { grid-column: 1 / -1; text-align: left; white-space: normal; }
    .releases .beats .delta:first-child { margin-left: 0; }
    .list img { width: 36px; height: 36px; }
    .toolbar { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar .hint { white-space: nowrap; }
    .stats { grid-template-columns: 1fr; gap: 8px; }
    .stat { display: flex; align-items: baseline; justify-content: space-between; }
  }
</style>

<script id="searchd-data" type="application/json">__SEARCHD_DATA__</script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Data + small helpers
// ---------------------------------------------------------------------------------------------
const D = JSON.parse(document.getElementById("searchd-data").textContent);
const MEDALS = ["🥇", "🥈", "🥉"];
const key = (keyword, country) => keyword + "|" + country;
const entry = (keyword, country) => D.entries[key(keyword, country)];
const tracked = D.keywords.filter((k) => k.status === "tracked");
const ideas = D.keywords.filter((k) => k.status === "idea");
const fmt = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });

/** Flag emoji from a 2-letter code: "de" → 🇩🇪 (two "regional indicator" letters). */
const flag = (cc) => [...cc.toUpperCase()].map((c) => String.fromCodePoint(0x1f1e6 + c.charCodeAt(0) - 65)).join("");

/** Create an element. `text` always goes in as textContent, so untrusted text can't become HTML. */
function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(props)) {
    if (value === undefined || value === null || value === false) continue;
    if (name === "text") node.textContent = value;
    else if (name === "class") node.className = value;
    else node.setAttribute(name, value);
  }
  for (const child of [].concat(children)) if (child) node.append(child);
  return node;
}

/** The rank pill: 🥇🥈🥉 for 1–3, "#12" otherwise, "200+" when not in the results. */
function rankPill(rank) {
  if (!rank) return el("span", { class: "rank r-none", text: "200+" });
  const band = rank <= 10 ? "r-10" : rank <= 50 ? "r-50" : "r-200";
  if (rank <= 3) return el("span", { class: "rank medal", text: MEDALS[rank - 1], title: "#" + rank, "aria-label": "rank " + rank });
  return el("span", { class: "rank " + band, text: "#" + rank });
}

/**
 * The days a keyword was checked, oldest first: [{ date, rank }], rank null = 200+.
 * D.history is { dates: [...], ranks: { "keyword|cc": [one value per date] } }, where a value
 * is the rank, 0 for 200+, or null when it wasn't checked that day.
 */
function points(k) {
  return (D.history.ranks[k] || [])
    .map((rank, i) => ({ date: D.history.dates[i], rank: rank === 0 ? null : rank, checked: rank !== null }))
    .filter((p) => p.checked);
}

/** Rank change since the previous day this keyword was checked. 200+ counts as 201. */
function delta(k) {
  const days = points(k);
  if (days.length < 2) return null;
  const before = days[days.length - 2].rank ?? 201;
  const now = days[days.length - 1].rank ?? 201;
  const change = before - now;
  if (!change) return null;
  return el("span", { class: "delta " + (change > 0 ? "up" : "down"), text: (change > 0 ? "▲" : "▼") + Math.abs(change), title: "since " + days[days.length - 2].date });
}

/** A 0–100 score as a number + bar. `hard` colors it like difficulty. */
function scoreBar(value, hard) {
  const fill = el("span");
  fill.style.width = Math.max(2, value) + "%"; // CSSOM, so it works under the CSP
  return el("div", { class: "score" }, [el("span", { class: "n", text: String(value) }), el("div", { class: "bar" + (hard ? " hard" : "") }, fill)]);
}

const isSweet = (e) => e.volume >= D.sweetSpot.minVolume && e.difficulty <= D.sweetSpot.maxDifficulty;

function appIcon(app, cls) {
  return el("img", { src: app.icon || null, alt: app.name, title: app.name, loading: "lazy", class: cls, referrerpolicy: "no-referrer" });
}

/**
 * Build-up entrance: each row rises 35 ms after the one before. The steps stop growing after
 * 12 rows, so a long table is fully there in well under a second.
 */
function stagger(nodes) {
  nodes.forEach((n, i) => { n.classList.add("rise"); n.style.setProperty("--d", Math.min(i, 12) * 35 + "ms"); });
  return nodes;
}

function empty(message) {
  return el("div", { class: "panel empty", text: message });
}

// ---------------------------------------------------------------------------------------------
// State: which tab, country and filter are showing. Remembered per browser when possible.
// ---------------------------------------------------------------------------------------------
const state = { tab: "board", country: D.app.countries[0], boardFilter: "tracked" };
try { Object.assign(state, JSON.parse(localStorage.getItem("searchd-view") || "{}")); } catch {}
if (!D.app.countries.includes(state.country)) state.country = D.app.countries[0];
const save = () => { try { localStorage.setItem("searchd-view", JSON.stringify(state)); } catch {} };

// ---------------------------------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------------------------------
const TABS = [
  { id: "board", label: "Board", icon: "board", desc: "Every keyword in every country, at a glance.", count: () => D.keywords.length, render: board },
  { id: "keywords", label: "Keywords", icon: "keywords", desc: "Where you rank for the keywords you track.", count: () => tracked.length, render: () => keywordTable(tracked, "rank"), countries: true },
  { id: "competitors", label: "Competitors", icon: "competitors", desc: "The apps ranking above you most often.", count: () => D.losingTo.length, render: competitors, countries: true },
  { id: "ideas", label: "Ideas", icon: "ideas", desc: "Keywords worth adding, best opportunity first.", count: () => ideas.length, render: () => keywordTable(ideas, "opportunity"), countries: true },
  { id: "history", label: "History", icon: "history", desc: "How each keyword's rank has moved day to day.", count: () => D.history.dates.length, render: history, countries: true },
];

// The nav buttons are built once and only their active state changes, so it can fade between tabs.
const navButtons = TABS.map((t) => {
  const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  icon.setAttribute("class", "ic");
  icon.setAttribute("aria-hidden", "true");
  const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
  use.setAttribute("href", "#i-" + t.icon);
  icon.append(use);
  const b = el("button", { class: "nav-btn", type: "button", title: t.label }, [icon, el("span", { class: "lbl", text: t.label }), el("span", { class: "count", text: String(t.count()) })]);
  b.addEventListener("click", () => { if (state.tab === t.id) return; state.tab = t.id; save(); render(); window.scrollTo(0, 0); });
  return b;
});
document.getElementById("tabs").replaceChildren(...navButtons);

let shownTab = null; // the tab on screen, so render() can tell a tab switch from a country/filter change
let chips = []; // the toolbar's chips, so a country/filter change only flips which one is pressed

function render() {
  const tab = TABS.find((t) => t.id === state.tab) || TABS[0];
  const newTab = tab.id !== shownTab;
  shownTab = tab.id;
  navButtons.forEach((b, i) => {
    const on = TABS[i] === tab;
    b.classList.toggle("is-active", on);
    if (on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  document.getElementById("page-title").textContent = tab.label;
  document.getElementById("page-desc").textContent = tab.desc;
  // A tab's toolbar never changes, so it's built once per tab; keeping the same chips lets the
  // pressed color fade from one chip to the next instead of jumping.
  if (newTab) { chips = []; document.getElementById("toolbar").replaceChildren(...toolbar(tab)); }
  else for (const c of chips) c.b.setAttribute("aria-pressed", String(c.pressed()));
  document.getElementById("view").replaceChildren(tab.render());
}

/** A toolbar chip. `pressed` is a function, re-asked on every render. */
function chip(label, pressed, onClick) {
  const b = el("button", { class: "chip", type: "button", "aria-pressed": String(pressed()), text: label });
  b.addEventListener("click", () => { if (!pressed()) onClick(); });
  chips.push({ b, pressed });
  return b;
}

function toolbar(tab) {
  const items = [];
  if (tab.id === "board") {
    for (const [id, label] of [["tracked", "Tracked"], ["idea", "Ideas"], ["all", "All"]]) {
      items.push(chip(label, () => state.boardFilter === id, () => { state.boardFilter = id; save(); render(); }));
    }
    items.push(el("span", { class: "hint", text: "Hover a rank to see the local phrase searched." }));
  }
  if (tab.countries) {
    for (const cc of D.app.countries) {
      items.push(chip(flag(cc) + " " + cc.toUpperCase(), () => state.country === cc, () => { state.country = cc; save(); render(); }));
    }
  }
  if (tab.id === "ideas") {
    items.push(el("span", { class: "sep" }), el("span", { class: "hint", text: "★ sweet spot: volume ≥ " + D.sweetSpot.minVolume + " and difficulty ≤ " + D.sweetSpot.maxDifficulty }));
  }
  return items;
}

// ---------------------------------------------------------------------------------------------
// Board: keyword × country rank grid
// ---------------------------------------------------------------------------------------------
function board() {
  const rows = state.boardFilter === "all" ? D.keywords : D.keywords.filter((k) => k.status === state.boardFilter);
  if (!rows.length) return empty(state.boardFilter === "idea" ? "No ideas yet. Run /searchd-find to brainstorm some." : "No keywords here yet.");
  const head = el("tr", {}, [el("th", { text: "Keyword" }), ...D.app.countries.map((cc) => el("th", { class: "center", text: flag(cc) + " " + cc.toUpperCase() }))]);
  const body = stagger(rows.map((k) => el("tr", {}, [
    el("td", {}, [el("span", { class: "kw", text: k.keyword }), state.boardFilter === "all" ? el("span", { class: "status", text: k.status }) : null]),
    ...D.app.countries.map((cc) => {
      const e = entry(k.keyword, cc);
      if (!e) return el("td", { class: "center" }, el("span", { class: "hint", text: "—", title: "not checked yet" }));
      return el("td", { class: "center", title: flag(cc) + " " + e.phrase }, [rankPill(e.rank), delta(key(k.keyword, cc))]);
    }),
  ])));
  return el("div", { class: "panel scroll" }, el("table", { class: "board" }, [el("thead", {}, head), el("tbody", {}, body)]));
}

// ---------------------------------------------------------------------------------------------
// Keywords and Ideas: one country at a time, with volume, difficulty and the top 5 apps
// ---------------------------------------------------------------------------------------------
function keywordTable(list, sortBy) {
  const cc = state.country;
  const rows = list.map((k) => ({ k, e: entry(k.keyword, cc) })).filter((r) => r.e);
  if (!rows.length) {
    return empty(list.length ? "Nothing checked in " + flag(cc) + " " + cc.toUpperCase() + " yet. Run /searchd-find." : list === ideas ? "No ideas yet. Run /searchd-find to brainstorm some." : "No tracked keywords yet. Run /searchd-setup or /searchd-find.");
  }
  // Rank: best first, 200+ last. Opportunity: highest first.
  rows.sort(sortBy === "rank" ? (a, b) => (a.e.rank ?? 999) - (b.e.rank ?? 999) : (a, b) => b.e.opportunity - a.e.opportunity);
  const head = el("tr", {}, ["Keyword", "Rank", "Volume", "Difficulty", "Opportunity", "Top 5"].map((t, i) => el("th", { class: i === 1 ? "center" : i === 4 ? "num" : "", text: t })));
  const body = stagger(rows.map(({ k, e }) => {
    const sweet = isSweet(e);
    return el("tr", { class: sweet && list === ideas ? "sweet" : "" }, [
      el("td", {}, [
        el("div", {}, [el("span", { class: "kw", text: e.phrase }), sweet ? el("span", { class: "star", text: "★", title: "sweet spot" }) : null]),
        e.phrase !== k.keyword ? el("div", { class: "orig", text: k.keyword }) : null,
      ]),
      el("td", { class: "center" }, [rankPill(e.rank), delta(key(k.keyword, cc))]),
      el("td", {}, scoreBar(e.volume)),
      el("td", {}, scoreBar(e.difficulty, true)),
      el("td", { class: "num", text: String(e.opportunity) }),
      el("td", {}, el("div", { class: "icons" }, e.top.map((id) => appIcon(D.apps[id] || {}, id === D.app.id ? "me" : "")))),
    ]);
  }));
  const hint = el("p", { class: "hint", text: "Volume is a demand estimate from how many top-50 apps target the phrase, not a real search count. Difficulty comes from the top 10 apps' rating counts." });
  return el("div", {}, [el("div", { class: "panel scroll" }, el("table", {}, [el("thead", {}, head), el("tbody", {}, body)])), hint]);
}

// ---------------------------------------------------------------------------------------------
// Competitors: who beats you most, plus a head-to-head with the competitors you added
// ---------------------------------------------------------------------------------------------
function competitors() {
  const parts = [];
  const total = Object.keys(D.entries).length;
  const mine = new Set(D.app.competitors.map((c) => c.id));
  parts.push(el("h2", { text: "Losing to" }));
  if (!D.losingTo.length) parts.push(empty("Nobody ranks above you in any check. Nice."));
  else {
    parts.push(el("ul", { class: "panel list" }, stagger(D.losingTo.map((a, i) => el("li", {}, [
      el("span", { class: "pos", text: String(i + 1) }),
      appIcon(a),
      el("div", {}, [
        el("div", {}, [el("span", { class: "name", text: a.name }), mine.has(a.id) ? el("span", { class: "tag", text: "your competitor" }) : null]),
        el("div", { class: "sub", text: fmt.format(a.ratings) + " ratings · average position #" + a.avgPosition }),
      ]),
      el("div", { class: "beats" }, [el("b", { text: String(a.beats) }), el("div", { class: "sub", text: "of " + total + " checks" })]),
    ])))));
    parts.push(el("p", { class: "hint", text: "Counts every keyword × country where the app is in the top 10 and ranks above you (all countries)." }));
  }

  if (D.app.competitors.length) {
    const cc = state.country;
    parts.push(el("h2", { text: "Head to head · " + flag(cc) + " " + cc.toUpperCase() }));
    const head = el("tr", {}, [el("th", { text: "Keyword" }), el("th", { class: "center", text: "You" }), ...D.app.competitors.map((c) => el("th", { class: "center" }, el("div", { class: "icons" }, [appIcon(c), el("span", { text: c.name.split(/[:\-–]/)[0].trim() })])))]);
    const rows = stagger(D.keywords.map((k) => entry(k.keyword, cc)).filter(Boolean).map((e) => el("tr", {}, [
      el("td", {}, el("span", { class: "kw", text: e.phrase })),
      el("td", { class: "center" }, rankPill(e.rank)),
      ...D.app.competitors.map((c) => el("td", { class: "center" }, rankPill(e.competitors?.[c.id] ?? null))),
    ])));
    parts.push(rows.length ? el("div", { class: "panel scroll" }, el("table", {}, [el("thead", {}, head), el("tbody", {}, rows)])) : empty("Nothing checked in this country yet."));
  }
  return el("div", {}, parts);
}

// ---------------------------------------------------------------------------------------------
// History: one small rank-over-time chart per tracked keyword
// ---------------------------------------------------------------------------------------------
const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}, text) {
  const node = document.createElementNS(SVG, tag);
  for (const [n, v] of Object.entries(attrs)) node.setAttribute(n, v);
  if (text !== undefined) node.textContent = text;
  return node;
}

/**
 * Ranks are drawn on a LOG scale with #1 at the top: moving from #40 to #20 matters as much as
 * #4 to #2, and a linear scale would squash the top 10 (where it really counts) into a sliver.
 */
function rankChart(points) {
  const W = 300, H = 120, L = 30, R = 8, T = 6, B = 20;
  const y = (rank) => T + (Math.log(rank) / Math.log(201)) * (H - T - B);
  const x = (i) => (points.length === 1 ? (L + W - R) / 2 : L + (i / (points.length - 1)) * (W - L - R));
  const s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img" });
  for (const [rank, label] of [[1, "1"], [10, "10"], [50, "50"], [201, "200+"]]) {
    s.append(svg("line", { class: "grid", x1: L, x2: W - R, y1: y(rank), y2: y(rank) }));
    s.append(svg("text", { class: "axis", x: L - 5, y: y(rank) + 3, "text-anchor": "end" }, label));
  }
  // A dashed marker at each release inside the chart's dates. The x axis is spaced by checked
  // day, not calendar day, so a release between two checks sits halfway between them.
  for (const r of D.releases) {
    if (points.length < 2 || r.date < points[0].date || r.date > points[points.length - 1].date) continue;
    const j = points.findIndex((p) => p.date >= r.date);
    const at = x(points[j].date === r.date ? j : j - 0.5);
    const g = svg("g", { class: "rel" });
    g.append(svg("title", {}, "v" + r.version + " released " + r.date), svg("line", { x1: at, x2: at, y1: T, y2: H - B }), svg("text", { x: at + 3, y: T + 7 }, "v" + r.version));
    s.append(g);
  }
  // Break the line where the app wasn't ranked (200+), so a gap reads as "not found", not a drop to 201.
  let d = "";
  points.forEach((p, i) => {
    if (p.rank) d += (i && points[i - 1].rank ? "L" : "M") + x(i).toFixed(1) + " " + y(p.rank).toFixed(1);
  });
  // Soft fill under each unbroken stretch of line, down to the "200+" row.
  const base = y(201).toFixed(1);
  for (const run of d.split("M").filter(Boolean)) {
    const pts = run.split("L");
    if (pts.length < 2) continue;
    const first = pts[0].split(" ")[0], last = pts[pts.length - 1].split(" ")[0];
    s.append(svg("path", { class: "area", d: "M" + pts.join("L") + "L" + last + " " + base + "L" + first + " " + base + "Z" }));
  }
  if (d) s.append(svg("path", { class: "line", d, pathLength: 1 }));
  points.forEach((p, i) => {
    // The newest point gets a halo, so a single day of data still reads as "you are here".
    if (i === points.length - 1 && p.rank) s.append(svg("circle", { class: "halo", cx: x(i), cy: y(p.rank), r: 7 }));
    const dot = svg("circle", { class: p.rank ? "dot" : "gap", cx: x(i), cy: y(p.rank ?? 201), r: points.length > 30 ? 2 : 3.5 });
    dot.append(svg("title", {}, p.date + ": " + (p.rank ? "#" + p.rank : "200+")));
    s.append(dot);
  });
  s.append(svg("text", { class: "axis", x: L, y: H - 3 }, points[0].date));
  if (points.length > 1) s.append(svg("text", { class: "axis", x: W - R, y: H - 3, "text-anchor": "end" }, points[points.length - 1].date));
  return s;
}

/** An average rank from releaseImpact (12.4 → "#12"), with 200+ for keywords that weren't found. */
const avgRank = (v) => (v >= 200.5 ? "200+" : "#" + Math.round(v));

/**
 * "Since v2.3: #18 → #9" under a chart: the newest release with enough history on both sides
 * of it for this keyword (a week before vs a week after; see releaseImpact in dashboard.js).
 */
function sinceRelease(k) {
  const r = [...D.releases].reverse().find((rel) => rel.impact[k]);
  if (!r) return null;
  const [before, after] = r.impact[k];
  return el("span", { class: after < before ? "delta up" : after > before ? "delta down" : "", title: "Average rank, the week before vs the week after " + r.date }, ["Since v" + r.version + ": ", el("b", { text: avgRank(before) + " → " + avgRank(after) })]);
}

/** The newest releases, each with how many keywords in this country moved up or down after it. */
function releaseList(cc) {
  const items = D.releases.slice(-6).reverse().map((r) => {
    const moves = Object.entries(r.impact).filter(([k]) => k.endsWith("|" + cc)).map(([, [before, after]]) => before - after);
    const changed = r.changes.filter((c) => c !== "version").map((c) => el("span", { class: "tag", text: c + " changed" }));
    const date = new Date(r.date + "T00:00").toLocaleDateString(undefined, { dateStyle: "medium" });
    return el("li", {}, [
      el("span", { class: "ver", text: "v" + r.version }),
      el("div", {}, [el("div", { class: "when" }, [el("b", { text: date }), ...changed]), r.notes ? el("div", { class: "sub notes", text: r.notes, title: r.notes }) : null]),
      el("div", { class: "beats" }, moves.length
        ? [el("span", { class: "delta up", text: "▲" + moves.filter((m) => m > 0).length }), el("span", { class: "delta down", text: "▼" + moves.filter((m) => m < 0).length }), el("div", { class: "sub", text: "keywords, week after vs before" })]
        : el("div", { class: "sub", text: "needs tracked days before and after it" })),
    ]);
  });
  return el("ul", { class: "panel list releases" }, stagger(items));
}

function history() {
  const cc = state.country;
  const rows = tracked.map((k) => ({ k, series: points(key(k.keyword, cc)), e: entry(k.keyword, cc) })).filter((r) => r.series.length);
  if (!rows.length) return empty("No history in " + flag(cc) + " " + cc.toUpperCase() + " yet. Run /searchd-track once a day to build it.");
  const now = (r) => r.series[r.series.length - 1].rank;
  const change = (r) => (r.series.length < 2 ? 0 : (r.series[0].rank ?? 201) - (now(r) ?? 201)); // + = moved up
  const stat = (n, label) => el("div", { class: "panel stat" }, [el("b", { text: String(n) }), el("span", { text: label })]);
  const summary = el("div", { class: "stats" }, stagger([
    stat(rows.filter((r) => now(r) && now(r) <= 10).length, "in the top 10"),
    stat(rows.filter((r) => change(r) > 0).length, "moved up"),
    stat(rows.filter((r) => change(r) < 0).length, "moved down"),
  ]));
  const charts = rows.map((r) => {
    const ranked = r.series.filter((p) => p.rank).map((p) => p.rank);
    const c = change(r);
    return el("div", { class: "panel chart" }, [
      el("div", { class: "title" }, [el("span", { class: "kw", text: r.e ? r.e.phrase : r.k.keyword, title: r.k.keyword }), rankPill(now(r))]),
      rankChart(r.series),
      el("div", { class: "foot" }, [
        el("span", {}, ["Best ", el("b", { text: ranked.length ? "#" + Math.min(...ranked) : "200+" })]),
        el("span", {}, [el("b", { text: String(r.series.length) }), r.series.length === 1 ? " day tracked" : " days tracked"]),
        r.series.length > 1 ? el("span", { class: c > 0 ? "delta up" : c < 0 ? "delta down" : "", text: !c ? "no change" : !r.series[0].rank ? "▲ entered the results" : !now(r) ? "▼ left the results" : (c > 0 ? "▲" : "▼") + Math.abs(c) + " overall" }) : null,
        sinceRelease(key(r.k.keyword, cc)),
      ]),
    ]);
  });
  const parts = [summary];
  if (D.releases.length) parts.push(el("h2", { text: "Releases" }), releaseList(cc), el("h2", { text: "Keywords" }));
  parts.push(el("div", { class: "charts" }, stagger(charts)));
  if (D.history.dates.length < 2) parts.push(el("p", { class: "hint", text: "One day of history so far. Run /searchd-track daily (and after listing changes) to see the trend." }));
  return el("div", {}, parts);
}

// ---------------------------------------------------------------------------------------------
// Header, theme toggle, start
// ---------------------------------------------------------------------------------------------
for (const id of ["app-icon", "top-icon"]) {
  const img = document.getElementById(id);
  if (D.app.icon) { img.src = D.app.icon; img.referrerPolicy = "no-referrer"; } else img.remove();
}
document.getElementById("app-name").textContent = document.getElementById("top-name").textContent = D.app.name;
document.getElementById("app-sub").textContent = tracked.length + " tracked · " + ideas.length + " ideas";
const updated = D.updatedAt ? new Date(D.updatedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "never";
const run = document.getElementById("run-card");
run.append(el("div", { text: "Last checked" }), el("b", { text: updated }), el("div", { class: "flags", text: D.app.countries.map(flag).join(" ") }));
document.getElementById("footer").textContent = "Built by searchd from Apple's iTunes Search API. Its order can differ slightly from the App Store app. Re-run /searchd-dashboard to refresh.";

// Theme: follows the system until you pick one; your pick is remembered in this browser.
const root = document.documentElement;
const systemDark = matchMedia("(prefers-color-scheme: dark)");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
try { const t = localStorage.getItem("searchd-theme"); if (t) root.dataset.theme = t; } catch {}
const currentTheme = () => (root.dataset.theme || (systemDark.matches ? "dark" : "light"));

/** Point both switches (sidebar and phone top bar) at the theme in use. */
function syncThemeSwitches() {
  for (const sw of document.querySelectorAll(".theme-switch")) {
    sw.dataset.on = currentTheme();
    for (const b of sw.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.set === sw.dataset.on));
  }
}
for (const btn of document.querySelectorAll(".theme-switch button")) btn.addEventListener("click", () => {
  if (btn.dataset.set === currentTheme()) return;
  const apply = () => { root.dataset.theme = btn.dataset.set; syncThemeSwitches(); };
  // Crossfade the whole page where the browser can (View Transitions); otherwise switch at once.
  if (document.startViewTransition && !reduceMotion.matches) document.startViewTransition(apply); else apply();
  try { localStorage.setItem("searchd-theme", btn.dataset.set); } catch {}
});
systemDark.addEventListener("change", syncThemeSwitches);
syncThemeSwitches();

render();
// Turn on the switch's slide only after the first frame, so it doesn't animate into place on load.
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("ready")));
</script>
</body>
</html>
